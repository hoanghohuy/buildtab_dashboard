<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22" />
      <stop offset="1" stop-color="#020617" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1220" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="#0b1220" />
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Cross roads -->
  <path d="M60 230 L 740 230 L 740 260 L 60 260 Z" fill="url(#asphalt)" />
  <path d="M380 80 L 410 80 L 410 400 L 380 400 Z" fill="url(#asphalt)" />

  <!-- Lane lines -->
  <path d="M100 245 L 700 245" stroke="#34d399" stroke-width="3" stroke-opacity="0.9" />
  <path d="M395 120 L 395 370" stroke="#93c5fd" stroke-width="3" stroke-opacity="0.7" />

  <!-- Intersection markers -->
  <g opacity="0.95">
    <circle cx="395" cy="245" r="10" fill="#fbbf24" />
    <circle cx="395" cy="245" r="22" fill="#fbbf24" opacity="0.12" />
    <rect x="330" y="205" width="120" height="80" rx="16" fill="#0f172a" opacity="0.85" />
  </g>

  <!-- Nearby blocks -->
  <g opacity="0.85">
    <rect x="90" y="290" width="140" height="45" rx="10" fill="#1f2937" />
    <rect x="600" y="290" width="110" height="45" rx="10" fill="#111827" />
    <rect x="200" y="80" width="110" height="38" rx="10" fill="#111827" />
  </g>

  <text x="50%" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#e5e7eb">
    Nut giao ven bien - Km52
  </text>
</svg>

